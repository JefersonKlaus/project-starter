name: CI

on:
  push:
  pull_request:

# Cancels the previous run of the same branch when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: format # only runs if the format check passes
    defaults:
      run:
        working-directory: backend-ia/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend-ia/api/lambda_create/requirements.txt
            backend-ia/api/lambda_create/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r lambda_create/requirements-dev.txt pytest pytest-cov httpx

      - name: Run unit tests
        run: >
          python -m pytest
          --cov=main --cov=machine --cov=rag --cov=models
          --cov-report=term-missing